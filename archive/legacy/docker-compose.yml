version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: aihg-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_home_gym

  redis:
    image: redis:7-alpine
    container_name: aihg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Optional: Mongo Express UI at http://localhost:8081
  mongo-express:
    image: mongo-express:latest
    container_name: aihg-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

volumes:
  mongo-data:
  redis-data:
