name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  actions: read # `changes` lists this workflow's earlier runs
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed since the newest commit these checks already passed on, on
  # this branch and for this kind of run (a pull request, or a push to master).
  # A push that changes ONLY record files — the rulings, the roadmap, a
  # handoff, a spec page: every path ending in .md — cannot change what the
  # code checks read (no source or test file reads a .md file), so the
  # code checks' parts, purity, database-test and migration jobs skip it.
  # gitleaks is not tied to this: it scans every push, records included.
  # The Neon migration job runs only when a migration file changed; db-tests
  # applies every migration on a fresh Postgres in every code run anyway.
  # Anything uncertain runs everything: no earlier green run on the branch, a
  # rewritten branch (no green commit this one grew from), an API error, more
  # files than the compare API lists (300), an output never written. The
  # distance is measured from the green commit, not the previous push, so a
  # code push whose run the concurrency group cancelled is covered by the
  # next run. Records-only pushes were 46 % of the billed minutes in the
  # first two weeks of 2026-09 (measured 2026-09-14).
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      migrations: ${{ steps.decide.outputs.migrations }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          code=true
          migrations=true
          # Judge the head against the newest green run of `$2` pushes on branch
          # `$1` that it grew from. Returns 1 when that branch has no such run;
          # 0 when it judged, or when an API error leaves the defaults standing.
          judge_from() {
            local shas sha cmp status files
            shas=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
              -f branch="$1" -f event="$2" -f status=success -F per_page=20 \
              --jq '.workflow_runs[].head_sha') || return 0
            for sha in $shas; do
              # One line each: the status, the file count, then the files.
              cmp=$(gh api "repos/$REPO/compare/$sha...$HEAD" \
                --jq '.status, (.files | length), .files[].filename') || return 0
              status=$(sed -n 1p <<<"$cmp")
              # Only a commit this one grew from counts; anything else is an
              # older or rewritten line, and the next older green run is tried.
              if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then continue; fi
              if [ "$(sed -n 2p <<<"$cmp")" -ge 300 ]; then return 0; fi
              files=$(sed -n '3,$p' <<<"$cmp")
              echo "changed since the green run on $sha ($status):"
              echo "$files" | sed 's/^/  /'
              if [ -z "$files" ] || ! grep -qvE '\.md$' <<<"$files"; then code=false; fi
              if ! grep -qE '^apps/api/drizzle/' <<<"$files"; then migrations=false; fi
              return 0
            done
            return 1
          }
          # A pull request's branch with no green run of its own yet grew from
          # the base branch, so its distance from the base's green run is the
          # pull request itself.
          judge_from "$BRANCH" "$EVENT" || { [ -n "$BASE" ] && judge_from "$BASE" push; } ||
            echo "no earlier green run that this commit grew from"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "::notice::code checks: $code · migration check: $migrations"

  # The code checks, each on a machine of its own, all at once (2026-11-25). Until then ONE machine of 4 cores did
  # typecheck, lint, seven packages' tests at the same time and the movement proof, one after another: 51 minutes on
  # 2026-11-24, and tests that timed out only because the machine was busy (20 failed test steps in 100 runs).
  # EVERY test still runs on every code push: nothing here is skipped by what a push touched, and nothing is
  # remembered from an earlier run, because tests in one package read files in another.
  # Each part has a time limit of 25 minutes: a part that grows past it goes red and is split again.
  # `gate` below is the check master requires; it is green only when every part is.
  static:
    name: typecheck and lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: this machine
        run: echo "cores $(nproc)" && free -g
      - run: pnpm typecheck
      - run: pnpm lint
  web-tests:
    name: web tests (${{ matrix.part }} of 2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec vitest run --shard=${{ matrix.part }}/2
  phone-tests:
    name: phone tests (${{ matrix.part }} of 2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The rules that need no screen (vitest), once; the screen tests (jest), half on each machine.
      - if: matrix.part == 1
        run: pnpm --filter mobile exec vitest run
      - run: pnpm --filter mobile exec jest --shard=${{ matrix.part }}/2
  small-tests:
    name: shared, engine and config tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The parts name each package by hand, so a package added to the workspace would be tested by nothing and no
      # check would say so. This step is red until a new package with tests is given a part and added to this list.
      - name: every package with tests has a part
        run: |
          have=$(pnpm m ls --json --depth -1 | jq -r '.[].path' | while read -r d; do jq -r 'select(.scripts.test != null) | .name' "$d/package.json"; done | sort | xargs)
          want="@app/config @app/engine @app/movement @app/shared api mobile web"
          echo "packages with tests: $have"
          if [ "$have" != "$want" ]; then echo "::error::the packages with tests are not the ones the parts run ($want)"; exit 1; fi
      - run: pnpm --filter @app/config test
      - run: pnpm --filter @app/shared test
      - run: pnpm --filter @app/engine test
      - name: golden traces (Part 2 §7.6)
        run: pnpm --filter @app/engine test:traces
      - name: definition linter (Part 2 §9.2)
        run: pnpm --filter @app/engine lint:defs
  movement-tests:
    name: movement tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/movement test
  movement-proof:
    name: the movement proof, ${{ matrix.part }} (Part 2 §12.5)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [squat-jump, lunge, rest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each proof file holds every kept video and its runs (up to 2.7 GB), two files at a time. The parts are named in
      # packages/movement/vitest.config.ts; "rest" is every proof file the other two leave.
      - run: pnpm --filter @app/movement test:proof
        env:
          PROOF_PART: ${{ matrix.part }}
          # The matrix above, less "rest". The proof's settings refuse to run when this is not every part they name,
          # so a part named there and not here is red, never left out.
          PROOF_PARTS_RUN: squat-jump,lunge
  # The check master requires. A part that failed, was cancelled or timed out is red here; a part that did not run is
  # green ONLY when `changes` said this push holds no code. `always()`, never `!cancelled()`: a required check that
  # is skipped counts as passed, so this one is never skipped.
  gate:
    name: typecheck / lint / test
    needs: [changes, static, web-tests, phone-tests, small-tests, movement-tests, movement-proof]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          code=$(jq -r '.changes.outputs.code // ""' <<<"$NEEDS")
          parts=$(jq -r 'to_entries[] | select(.key != "changes") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          echo "what changed: $changes (code: $code)"
          echo "$parts"
          want=success
          if [ "$changes" = success ] && [ "$code" = false ]; then want=skipped; fi
          if [ -z "$parts" ]; then echo "::error::no part reported"; exit 1; fi
          bad=0
          for p in $parts; do
            r=${p#*=}
            if [ "$r" = cancelled ]; then echo "::error::${p%%=*} was cancelled, by a newer push or by hand: nothing is wrong with the code, run it again"; bad=1
            elif [ "$r" != "$want" ]; then echo "::error::${p%%=*} ended $r, not $want"; bad=1; fi
          done
          exit $bad

  engine-purity:
    name: engine banned-token grep (R5.1)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Must print nothing (CLAUDE.md Appendix). grep exits 1 on no match = pass.
      - name: grep packages/engine/src and packages/movement/src for banned tokens
        run: |
          if grep -rnE 'Date\.now|new Date\(|Math\.random|performance\.now|setTimeout|setInterval|process\.env|window\.|document\.|navigator\.|localStorage|fetch\(|console\.|toLocale|Intl\.' packages/engine/src packages/movement/src; then
            echo '::error::Engine purity violation (R5.1/I1): banned token(s) found above.'
            exit 1
          fi

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Proves the migrations apply on a REAL Neon branch (Part 4 §1 / P0.2 mandate;
  # DECISIONS 2026-07-16: the CI branch clones primary WITH data). This job runs
  # ONLY the migration — the database TEST suites moved to the `db-tests` job
  # below, against a local Postgres, because Neon's network latency made the full
  # suite take ~38 min (measured 2026-07-23, all tests green but past the cap).
  # Runs only when a migration file changed (see `changes`).
  migrations:
    name: drizzle migrations on Neon branch
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.migrations != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: check for migrations
        id: has-migrations
        run: |
          if [ -d drizzle ] || ls apps/api/drizzle 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo '::notice::skipped: no migrations yet (arrives with task P0.3) — this job flips to enforcing when a drizzle/ folder exists.'
          fi
      - name: create Neon branch
        if: steps.has-migrations.outputs.present == 'true'
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}
      - uses: pnpm/action-setup@v4
        if: steps.has-migrations.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.has-migrations.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: apply migrations
        if: steps.has-migrations.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter api migrate
      - name: delete Neon branch
        if: always() && steps.has-migrations.outputs.present == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}

  # The api's tests, every one: the suites that need a database (describe.skipIf(no DATABASE_URL)) and the ones that
  # do not. They run only here. Among them is the Day-14 purge suite, the only code in the repo that irreversibly
  # destroys user data.
  #
  # Runs against a Postgres started ON THE RUNNER, not Neon: co-located means
  # near-zero per-query latency (the full suite is ~38 min against remote Neon
  # from a GH runner but ~minutes locally), no paid Neon compute per PR, and the
  # test DB is CLEAN by construction (migrate + seed only) — which also closes
  # the "CI branch clones dev data" flakiness question the card raised. The
  # image is pgvector/pgvector:pg16: migration 0001 needs the `vector` extension
  # (§3.7) plus contrib citext/pgcrypto, all present in that image (it is the
  # same image used for the local PROVE box). Only apps/api needs a DB (verified:
  # DATABASE_URL appears nowhere in packages/ or apps/web), hence --filter api.
  #
  # On three machines at once since 2026-11-25, a third of the test files on each (vitest's --shard, so no file is in
  # none), each machine with a Postgres and a Redis of its own: one machine took 25.6 minutes on 2026-11-24. These
  # runs hold EVERY api test (9,371 of 9,371 that day), so the api's tests no longer run a second time without a
  # database. `db-tests` below is the check master requires.
  api-tests:
    name: api tests (${{ matrix.part }} of 3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The runner may start stepping before Postgres accepts connections;
        # gate the job on pg_isready so `migrate` never races a cold server.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The route tests use an in-memory Redis; test/redis.scripts.test.ts runs
      # the Lua production runs (the scan and coach counters) on this one.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Distinctly-named so a red says WHICH part broke: migrate / seed / test.
      - name: apply migrations
        run: pnpm --filter api migrate
      # NOT optional: privacy.purge.test.ts states it "requires migrations
      # 0001-0007 applied and seed.ts run (exercises + achievements are FK
      # targets)". Idempotent, so re-running is safe.
      - name: seed reference data
        run: pnpm --filter api seed
      - name: api test suite
        run: pnpm --filter api exec vitest run --shard=${{ matrix.part }}/3

  # The check master requires: see `gate`.
  db-tests:
    name: api tests on local Postgres
    needs: [changes, api-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          code=$(jq -r '.changes.outputs.code // ""' <<<"$NEEDS")
          parts=$(jq -r 'to_entries[] | select(.key != "changes") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          echo "what changed: $changes (code: $code)"
          echo "$parts"
          want=success
          if [ "$changes" = success ] && [ "$code" = false ]; then want=skipped; fi
          if [ -z "$parts" ]; then echo "::error::no part reported"; exit 1; fi
          bad=0
          for p in $parts; do
            r=${p#*=}
            if [ "$r" = cancelled ]; then echo "::error::${p%%=*} was cancelled, by a newer push or by hand: nothing is wrong with the code, run it again"; bad=1
            elif [ "$r" != "$want" ]; then echo "::error::${p%%=*} ended $r, not $want"; bad=1; fi
          done
          exit $bad
