name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: golden traces (Part 2 §7.6)
        run: pnpm --filter @app/engine test:traces
      - name: definition linter (Part 2 §9.2)
        run: pnpm --filter @app/engine lint:defs

  engine-purity:
    name: engine banned-token grep (R5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Must print nothing (CLAUDE.md Appendix). grep exits 1 on no match = pass.
      - name: grep packages/engine/src for banned tokens
        run: |
          if grep -rnE 'Date\.now|new Date\(|Math\.random|performance\.now|setTimeout|setInterval|process\.env|window\.|document\.|navigator\.|localStorage|fetch\(|console\.|toLocale|Intl\.' packages/engine/src; then
            echo '::error::Engine purity violation (R5.1/I1): banned token(s) found above.'
            exit 1
          fi

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Migrations AND the database-backed api suites, on one throwaway Neon branch.
  # The `gate` job above runs `pnpm test` with NO DATABASE_URL, so every
  # describe.skipIf(DATABASE_URL) suite SKIPS there — measured 2026-07-23:
  # 153 passed / 188 skipped, with 16 of apps/api's 36 test files never running,
  # including the whole Day-14 purge suite (the only code in the repo that
  # irreversibly destroys user data). This job already creates and destroys a
  # branch, so running the suite here costs zero extra Neon branches.
  # Only apps/api needs a database (verified: DATABASE_URL appears nowhere in
  # packages/ or apps/web), which is why this filters to `api` rather than
  # re-running the workspace.
  migrations:
    name: drizzle migrations + api tests on Neon branch
    runs-on: ubuntu-latest
    # Bounds a hung suite against remote Neon; the branch is only reclaimed by
    # the delete step below, so an unbounded job is an unbounded live branch.
    # 30 is a judgment call, not a spec number (~7x the local full-suite run).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: check for migrations
        id: has-migrations
        run: |
          if [ -d drizzle ] || ls apps/api/drizzle 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo '::notice::skipped: no migrations yet (arrives with task P0.3) — this job flips to enforcing when a drizzle/ folder exists.'
          fi
      - name: create Neon branch
        if: steps.has-migrations.outputs.present == 'true'
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}
      - uses: pnpm/action-setup@v4
        if: steps.has-migrations.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.has-migrations.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      # Split into distinctly-named steps so a red says WHICH part broke:
      # install / migrate / seed / test are four different failures.
      - name: install dependencies
        if: steps.has-migrations.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: apply migrations
        if: steps.has-migrations.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: pnpm --filter api migrate
      # NOT optional: privacy.purge.test.ts states it "requires migrations
      # 0001-0007 applied and seed.ts run (exercises + achievements are FK
      # targets)". Idempotent (drizzle onConflict upserts; the definition
      # bundle is sha256-compared before insert), so re-seeding a branch
      # cloned from primary is a no-op.
      - name: seed reference data
        if: steps.has-migrations.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: pnpm --filter api seed
      - name: api test suite (Neon branch)
        if: steps.has-migrations.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: pnpm --filter api test
      - name: delete Neon branch
        if: always() && steps.has-migrations.outputs.present == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}
