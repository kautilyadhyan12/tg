name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  actions: read # `changes` lists this workflow's earlier runs
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed since the newest commit these checks already passed on, on
  # this branch and for this kind of run (a pull request, or a push to master).
  # A push that changes ONLY record files — the rulings, the roadmap, a
  # handoff, a spec page: every path ending in .md — cannot change what the
  # code checks read (no source or test file reads a .md file), so the
  # typecheck/lint/test, purity, database-test and migration jobs skip it.
  # gitleaks is not tied to this: it scans every push, records included.
  # The Neon migration job runs only when a migration file changed; db-tests
  # applies every migration on a fresh Postgres in every code run anyway.
  # Anything uncertain runs everything: no earlier green run on the branch, a
  # rewritten branch (no green commit this one grew from), an API error, more
  # files than the compare API lists (300), an output never written. The
  # distance is measured from the green commit, not the previous push, so a
  # code push whose run the concurrency group cancelled is covered by the
  # next run. Records-only pushes were 46 % of the billed minutes in the
  # first two weeks of 2026-09 (measured 2026-09-14).
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      migrations: ${{ steps.decide.outputs.migrations }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          code=true
          migrations=true
          # Judge the head against the newest green run of `$2` pushes on branch
          # `$1` that it grew from. Returns 1 when that branch has no such run;
          # 0 when it judged, or when an API error leaves the defaults standing.
          judge_from() {
            local shas sha cmp status files
            shas=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
              -f branch="$1" -f event="$2" -f status=success -F per_page=20 \
              --jq '.workflow_runs[].head_sha') || return 0
            for sha in $shas; do
              # One line each: the status, the file count, then the files.
              cmp=$(gh api "repos/$REPO/compare/$sha...$HEAD" \
                --jq '.status, (.files | length), .files[].filename') || return 0
              status=$(sed -n 1p <<<"$cmp")
              # Only a commit this one grew from counts; anything else is an
              # older or rewritten line, and the next older green run is tried.
              if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then continue; fi
              if [ "$(sed -n 2p <<<"$cmp")" -ge 300 ]; then return 0; fi
              files=$(sed -n '3,$p' <<<"$cmp")
              echo "changed since the green run on $sha ($status):"
              echo "$files" | sed 's/^/  /'
              if [ -z "$files" ] || ! grep -qvE '\.md$' <<<"$files"; then code=false; fi
              if ! grep -qE '^apps/api/drizzle/' <<<"$files"; then migrations=false; fi
              return 0
            done
            return 1
          }
          # A pull request's branch with no green run of its own yet grew from
          # the base branch, so its distance from the base's green run is the
          # pull request itself.
          judge_from "$BRANCH" "$EVENT" || { [ -n "$BASE" ] && judge_from "$BASE" push; } ||
            echo "no earlier green run that this commit grew from"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "::notice::code checks: $code · migration check: $migrations"

  gate:
    name: typecheck / lint / test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: golden traces (Part 2 §7.6)
        run: pnpm --filter @app/engine test:traces
      - name: definition linter (Part 2 §9.2)
        run: pnpm --filter @app/engine lint:defs

  engine-purity:
    name: engine banned-token grep (R5.1)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Must print nothing (CLAUDE.md Appendix). grep exits 1 on no match = pass.
      - name: grep packages/engine/src for banned tokens
        run: |
          if grep -rnE 'Date\.now|new Date\(|Math\.random|performance\.now|setTimeout|setInterval|process\.env|window\.|document\.|navigator\.|localStorage|fetch\(|console\.|toLocale|Intl\.' packages/engine/src; then
            echo '::error::Engine purity violation (R5.1/I1): banned token(s) found above.'
            exit 1
          fi

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Proves the migrations apply on a REAL Neon branch (Part 4 §1 / P0.2 mandate;
  # DECISIONS 2026-07-16: the CI branch clones primary WITH data). This job runs
  # ONLY the migration — the database TEST suites moved to the `db-tests` job
  # below, against a local Postgres, because Neon's network latency made the full
  # suite take ~38 min (measured 2026-07-23, all tests green but past the cap).
  # Runs only when a migration file changed (see `changes`).
  migrations:
    name: drizzle migrations on Neon branch
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.migrations != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: check for migrations
        id: has-migrations
        run: |
          if [ -d drizzle ] || ls apps/api/drizzle 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo '::notice::skipped: no migrations yet (arrives with task P0.3) — this job flips to enforcing when a drizzle/ folder exists.'
          fi
      - name: create Neon branch
        if: steps.has-migrations.outputs.present == 'true'
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}
      - uses: pnpm/action-setup@v4
        if: steps.has-migrations.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.has-migrations.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: apply migrations
        if: steps.has-migrations.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter api migrate
      - name: delete Neon branch
        if: always() && steps.has-migrations.outputs.present == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}

  # The database-backed api suites — every describe.skipIf(DATABASE_URL) suite,
  # which the `gate` job (no DATABASE_URL) SKIPS. Measured 2026-07-23: gate runs
  # 153 passed / 188 skipped, with 16 of apps/api's 36 test files never running,
  # including the whole Day-14 purge suite (the only code in the repo that
  # irreversibly destroys user data) — OWED "CI runs none of the database tests".
  #
  # Runs against a Postgres started ON THE RUNNER, not Neon: co-located means
  # near-zero per-query latency (the full suite is ~38 min against remote Neon
  # from a GH runner but ~minutes locally), no paid Neon compute per PR, and the
  # test DB is CLEAN by construction (migrate + seed only) — which also closes
  # the "CI branch clones dev data" flakiness question the card raised. The
  # image is pgvector/pgvector:pg16: migration 0001 needs the `vector` extension
  # (§3.7) plus contrib citext/pgcrypto, all present in that image (it is the
  # same image used for the local PROVE box). Only apps/api needs a DB (verified:
  # DATABASE_URL appears nowhere in packages/ or apps/web), hence --filter api.
  db-tests:
    name: api tests on local Postgres
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The runner may start stepping before Postgres accepts connections;
        # gate the job on pg_isready so `migrate` never races a cold server.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Distinctly-named so a red says WHICH part broke: migrate / seed / test.
      - name: apply migrations
        run: pnpm --filter api migrate
      # NOT optional: privacy.purge.test.ts states it "requires migrations
      # 0001-0007 applied and seed.ts run (exercises + achievements are FK
      # targets)". Idempotent, so re-running is safe.
      - name: seed reference data
        run: pnpm --filter api seed
      - name: api test suite
        run: pnpm --filter api test
