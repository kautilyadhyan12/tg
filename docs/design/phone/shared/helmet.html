<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Inter','SF Pro Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.screen{--base:#0A0908;--surface:#121110;--elevated:#1A1815;--line:rgba(255,255,255,0.06);--line2:rgba(255,255,255,0.10);--t1:rgba(255,255,255,0.95);--t2:rgba(255,255,255,0.62);--t3:rgba(255,255,255,0.42);--amber:#FF8A1F;--amber2:#FFB347;--amber-bg:rgba(255,138,31,0.10);--amber-line:rgba(255,138,31,0.28);--good:#22c55e;--good-bg:rgba(34,197,94,0.12);--bad:#ef4444;--bad-bg:rgba(239,68,68,0.12);--gold:#FFD66B;--gold-bg:rgba(255,214,107,0.12);--blue:#60a5fa;--purple:#a78bfa;width:390px;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative;background:var(--base);color:var(--t1);letter-spacing:-0.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;letter-spacing:inherit}
input{font-family:inherit}
h1,h2,h3,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.main{flex-grow:1;box-sizing:border-box;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
.col{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex-grow:1;min-width:0}
.rel{position:relative}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.swipe{display:flex;gap:10px;margin-right:-16px;overflow:hidden}
.swipe > *{flex-shrink:0}
.h1{font-size:28px;line-height:32px;font-weight:700;letter-spacing:-0.02em}
.h2{font-size:22px;line-height:26px;font-weight:700;letter-spacing:-0.02em}
.h3{font-size:15px;line-height:20px;font-weight:600}
.big{font-size:22px;line-height:26px;font-weight:700}
.eyebrow{font-size:11px;line-height:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.am{color:var(--amber)}
.s11{font-size:11px;line-height:14px}.s12{font-size:12px;line-height:16px}.s13{font-size:13px;line-height:18px}.s14{font-size:14px;line-height:20px}.s15{font-size:15px;line-height:21px}
.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;box-sizing:border-box}
.glass{background:rgba(255,255,255,0.035);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;box-sizing:border-box}
.pad{padding:14px}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art{mix-blend-mode:lighten}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,9,8,0.94) 0%,rgba(10,9,8,0.45) 50%,rgba(10,9,8,0.05) 100%)}
.shade-l{position:absolute;inset:0;background:linear-gradient(to right,rgba(10,9,8,0.92) 0%,rgba(10,9,8,0.55) 55%,rgba(10,9,8,0.1) 100%)}
.backdrop{position:absolute;left:0;right:0;width:100%;object-fit:contain;opacity:0.22;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 46% 48% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 46% 48% at 50% 50%,#000 55%,transparent 100%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:600;border:1px solid transparent;box-sizing:border-box;white-space:nowrap;color:var(--t1);background:transparent}
.btn-p{color:#fff;background:linear-gradient(135deg,#FF8A1F,#FFB347);box-shadow:0 4px 16px rgba(255,138,31,0.3),inset 0 1px 0 rgba(255,255,255,0.15)}
.btn-s{background:rgba(255,255,255,0.05);border-color:var(--line2)}
.btn-soft{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.btn-danger{background:var(--bad-bg);border-color:rgba(239,68,68,0.3);color:#f87171}
.btn-sm{height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn-wide{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,0.05);color:var(--t1);padding:0;flex-shrink:0;box-sizing:border-box}
.plus{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line)}
.badge{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line);background:rgba(255,255,255,0.05);color:var(--t2);white-space:nowrap;box-sizing:border-box}
.chip-on{background:linear-gradient(135deg,#FF8A1F,#FFB347);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(255,138,31,0.3)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;box-sizing:border-box;border:1px solid transparent}
.pill-good{background:var(--good-bg);color:#4ade80;border-color:rgba(34,197,94,0.25)}
.pill-gold{background:var(--gold-bg);color:var(--gold);border-color:rgba(255,214,107,0.25)}
.pill-bad{background:var(--bad-bg);color:#f87171;border-color:rgba(239,68,68,0.25)}
.pill-am{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.pill-plain{background:rgba(255,255,255,0.05);color:var(--t2);border-color:var(--line)}
.pill-ai{background:rgba(167,139,250,0.16);color:#c4b5fd;border-color:rgba(167,139,250,0.3)}
.pill-ai-solid{background:#6D4FE0;color:#fff;border-color:transparent}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;box-sizing:border-box;color:var(--t1);background:transparent;border:0;text-align:left;font-size:15px;line-height:20px;width:100%}
.row + .row{border-top:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--t2);font-size:15px;font-weight:600;box-sizing:border-box}
.nav-on{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.label{font-size:11px;line-height:14px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber)}
.input{height:48px;box-sizing:border-box;border-radius:14px;border:1px solid var(--line2);background:rgba(10,9,8,0.7);color:var(--t1);padding:0 14px;font-size:15px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:14px;color:var(--t3)}
.search input{padding-left:42px;border-radius:999px}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8A1F,#FFB347)}
.ring{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .trk{stroke:rgba(255,255,255,0.08)}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;line-height:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--t3)}
.day i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.06);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--t2);font-size:12px;font-weight:600;letter-spacing:0}
.day-done i{background:linear-gradient(135deg,#FF8A1F,#FFB347);color:#fff}
.day-now{color:var(--amber)}
.day-now i{border:1.5px solid var(--amber);background:var(--amber-bg);color:var(--amber)}
.strip{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 16px;box-sizing:border-box;background:var(--elevated);border-bottom:1px solid var(--line);color:var(--t2);font-size:13px;line-height:18px}
.tabbar{height:68px;flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#0D0C0B;border-top:1px solid var(--line);position:relative}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);font-size:11px;line-height:14px;font-weight:500}
.tab span{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:10px}
.tab-on{color:var(--amber);font-weight:600}
.tab-on span{background:var(--amber-bg);box-shadow:inset 0 0 0 1px var(--amber-line)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,0.66)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border:1px solid var(--line2);border-bottom:0;box-shadow:0 -12px 48px rgba(0,0,0,0.6);border-radius:24px 24px 0 0;padding:10px 16px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:999px;background:rgba(255,255,255,0.18);align-self:center}
.sw{height:52px;border-radius:12px;border:1px solid var(--line2);box-sizing:border-box}
</style>
</helmet>
