<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Me: Progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HELMET-->
<style>
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:110px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--t3)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#FFB347,#FF8A1F)}
</style>
<div data-root="1" class="screen" style="width: 390px; height: %H%px">
<img class="backdrop" src="%IMG:progress%" alt="" style="bottom: 68px; height: 380px; opacity: 0.2">
<main class="main">

<div class="hrow" style="gap: 4px; margin-left: -8px">
<a href="#me" class="icon-btn" aria-label="Back to Me" style="border: 0; background: transparent"><!--I:back:20--></a>
<span class="s14 w6 t2">Me</span>
</div>

<div class="col" style="gap: 2px"><h1 class="h1">Progress</h1><p class="s13 t2">Track your fitness journey over time</p></div>

<div class="swipe">
<button type="button" class="chip">7 Days</button>
<button type="button" class="chip chip-on">30 Days</button>
<button type="button" class="chip">90 Days</button>
<button type="button" class="chip">1 Year</button>
<button type="button" class="chip">All Time</button>
</div>

<section class="card pad col" style="gap: 12px" aria-labelledby="p-cal">
<div class="between"><h2 id="p-cal" class="h3">Calories Burned</h2><span class="s13 am w7 num">6,420 kcal</span></div>
<svg width="100%" height="110" viewBox="0 0 330 110" preserveAspectRatio="none" role="img" aria-label="Calories burned each week, rising over 30 days"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A1F" stop-opacity="0.35"></stop><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"></stop></linearGradient></defs><path d="M0 84 L55 70 L110 76 L165 48 L220 54 L275 30 L330 22 L330 110 L0 110 Z" fill="url(#pg)"></path><path d="M0 84 L55 70 L110 76 L165 48 L220 54 L275 30 L330 22" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</section>

<section class="card pad col" style="gap: 12px" aria-labelledby="p-week">
<h2 id="p-week" class="h3">Workouts Per Week</h2>
<div class="bars"><div><i style="height: 40%"></i>W1</div><div><i style="height: 60%"></i>W2</div><div><i style="height: 40%"></i>W3</div><div><i style="height: 80%"></i>W4</div><div><i style="height: 60%"></i>W5</div><div><i style="height: 20%"></i>W6</div></div>
</section>

<section class="card" aria-labelledby="p-rec">
<div class="pad" style="padding-bottom: 4px"><h2 id="p-rec" class="h3">Personal Records</h2></div>
<div class="row"><span class="badge"><!--I:clock:16--></span><span class="grow s14 w6">Longest workout</span><span class="s14 am w7 num">52 min</span></div>
<div class="row"><span class="badge"><!--I:flame:16--></span><span class="grow s14 w6">Most calories</span><span class="s14 am w7 num">410 kcal</span></div>
<div class="row"><span class="badge"><!--I:star:16--></span><span class="grow s14 w6">Best form</span><span class="s14 am w7 num">94</span></div>
</section>

<section class="card pad col" style="gap: 10px" aria-labelledby="p-con">
<div class="between"><h2 id="p-con" class="h3">Consistency</h2><span class="s13 t2 num">12 of 30 days</span></div>
<div class="bar" style="height: 8px"><span style="width: 40%"></span></div>
</section>

</main>
<!--TABBAR:me-->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":%H%}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
