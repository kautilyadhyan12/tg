</div>
<div class="bar" style="height: 8px"><span style="width: 83%"></span></div>
</section>

<button type="button" role="tab" aria-selected="true" class="btn btn-soft btn-sm" style="padding: 0; font-size: 13px">Badges</button>
<button type="button" role="tab" aria-selected="false" class="btn btn-s btn-sm" style="padding: 0; font-size: 13px">Challenges</button>

<div class="glass bdg bdg-off" style="background: rgba(40,36,32,0.72)"><i><!--I:calendar:22--></i><span class="s12 w6">30-Day Streak</span></div>

<div class="glass bdg bdg-off" style="background: rgba(40,36,32,0.72)"><i><!--I:pin:22--></i><span class="s12 w6">First Run</span></div>
<div class="glass bdg bdg-off" style="background: rgba(40,36,32,0.72)"><i><!--I:crown:22--></i><span class="s12 w6">Top 3</span></div>
