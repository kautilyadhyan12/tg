<html lang="en">
<head>

<body>
<x-dc>
<!--HELMET-->
<div data-root="1" class="screen" style="width: 390px; height: %H%px">
<img class="backdrop" src="%IMG:setting%" alt="" style="top: 330px; height: 420px; opacity: 0.28">
<main class="main">

<div class="between" style="align-items: flex-start">
<div class="col" style="gap: 2px"><h1 class="h1">Settings</h1><p class="s13 t2">Manage your profile and preferences</p></div>
<button type="button" class="btn btn-s btn-sm"><!--I:logout:16-->Sign Out</button>
</div>

<div class="card pad hrow" style="gap: 12px">
<div class="rel" style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#FF8A1F,#FFB347); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0">M<span style="position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--amber); border: 2px solid var(--surface); display: flex; align-items: center; justify-content: center; color: #fff"><!--I:camera:11--></span></div>
<div class="col grow" style="gap: 1px"><span class="s15 w7 ell">Maya Rao</span><span class="s12 t2 ell">maya.rao@gmail.com</span><span class="s11 t3">Member since 13/10/2026</span></div>
<span class="pill pill-am"><!--I:flame:11-->Level 7</span>
</div>

<div class="g2">
<a href="#progress" class="card" style="height: 110px"><img class="photo" src="%IMG:progress%" alt="" style="opacity: 0.7"><span class="shade"></span><div class="hrow" style="position: absolute; left: 12px; bottom: 12px; gap: 8px"><span class="am" style="display: flex"><!--I:chart:16--></span><span class="s14 w6">Progress</span></div></a>
<a href="#achievements" class="card" style="height: 110px"><img class="photo" src="%IMG:monalisa%" alt="" style="opacity: 0.7; object-position: 50% 20%"><span class="shade"></span><div class="hrow" style="position: absolute; left: 12px; bottom: 12px; gap: 8px"><span class="am" style="display: flex"><!--I:trophy:16--></span><span class="s14 w6">Achievements</span></div></a>
</div>

<nav aria-label="Settings" class="col rel" style="gap: 8px">
<a href="#profile" class="nav nav-on"><!--I:user:18--><span class="grow">Profile</span><!--I:go:16--></a>
<a href="#fitness" class="nav"><!--I:dumbbell:18--><span class="grow">Fitness</span><!--I:go:16--></a>
<a href="#gym" class="nav"><!--I:building:18--><span class="grow">Gym</span><!--I:go:16--></a>
<a href="#account" class="nav"><!--I:shield:18--><span class="grow">Account</span><!--I:go:16--></a>
<a href="#notifications" class="nav"><!--I:bell:18--><span class="grow">Notifications</span><!--I:go:16--></a>
</nav>

<div class="g2 rel" style="gap: 12px 10px">
<label class="col" style="gap: 6px; grid-column: 1 / -1"><span class="label">Full Name</span><span class="input">Maya Rao</span></label>
<label class="col" style="gap: 6px"><span class="label">Age</span><span class="input num">27</span></label>
<label class="col" style="gap: 6px"><span class="label">Gender</span><span class="input">Female<span class="t3" style="display: flex"><!--I:down:16--></span></span></label>
<label class="col" style="gap: 6px"><span class="label">Height</span><span class="input num">165<span class="s12 t3">cm</span></span></label>
<label class="col" style="gap: 6px"><span class="label">Current Weight</span><span class="input num">74.5<span class="s12 t3">kg</span></span></label>
</div>

<button type="button" class="btn btn-p btn-wide rel"><!--I:save:16-->Save Changes</button>

</main>
<!--TABBAR:me-->
</div>
</x-dc>
