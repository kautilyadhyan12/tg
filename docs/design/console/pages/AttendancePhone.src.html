<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attendance — dark, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HELMET-->
<div data-root="1" class="t-dark" style="width: 390px; height: %H%px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
<!--TOPBAR-->
<main style="flex-grow: 1; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="h1p">Attendance</h1>
<p class="sub">Who came in, by day. Times are your gym’s own.</p>
</div>
<div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px">
<button type="button" class="icon-btn" aria-label="Previous day" style="border: 1px solid var(--ctl-line); width: 44px; height: 44px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button type="button" class="btn btn-s btn-lg" aria-label="Day"><span style="color: var(--link); display: flex"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></span>Sat 26 Sep · Today</button>
<button type="button" class="icon-btn" aria-label="Next day" style="border: 1px solid var(--ctl-line); width: 44px; height: 44px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<div class="card" style="overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px">
<div style="display: flex; align-items: baseline; gap: 10px"><h2 class="h2">Who came</h2><span class="s14 t2">23 people · 27 visits</span></div>
<label class="search"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input class="input" type="search" placeholder="Search by name" aria-label="Search by name"></label>
<div><button type="button" class="chip" aria-pressed="false">Outside opening hours <span class="n">1</span></button></div>
</div>
<button type="button" style="width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span class="s15 w6">Olivia Bennett</span><span class="s13 t2">olivia.bennett@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">6:02 AM</span></span>
</button>
<button type="button" style="width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span class="s15 w6">Marcus Reed</span><span class="s13 t2">marcus.reed@example.com</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span class="tc">6:15 AM</span><span class="tc">5:40 PM</span><span class="s13 w6 t2" style="padding-left: 4px">came 2 times</span></span>
</button>
<button type="button" style="width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span class="s15 w6">Sofia Alvarez</span><span class="s13 t2">sofia.alvarez@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">7:30 AM</span></span>
</button>
<button type="button" style="width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span class="s15 w6">Emma Clarke</span><span class="s13 t2">emma.clarke@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc tc-warn">5:41 AM · outside hours</span></span>
</button>
<button type="button" style="width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span class="s15 w6">Liam Hughes</span><span class="s13 t2">liam.hughes@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">12:10 PM</span></span>
</button>
<div style="padding: 14px 16px; border-top: 1px solid var(--line)"><button type="button" class="btn btn-s btn-lg" style="width: 100%">Show more people</button></div>
</div>
</main>
<!--TABBAR:attendance-->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":%H%}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
