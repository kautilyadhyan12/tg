<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attendance — dark, computer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HELMET-->
<div data-root="1" class="t-dark" style="width: 1440px; height: %H%px; display: flex; box-sizing: border-box; overflow: hidden">
<!--RAIL:attendance-->
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 36px 48px 48px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-direction: column; gap: 6px">
<h1 class="h1">Attendance</h1>
<p class="sub">Who came in, by day. Times are your gym’s own.</p>
</header>

<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<button type="button" class="icon-btn btn-s" aria-label="Previous day" style="border: 1px solid var(--ctl-line); width: 44px; height: 44px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button type="button" class="btn btn-s btn-lg" aria-label="Day" style="min-width: 250px; justify-content: flex-start"><span style="color: var(--link); display: flex"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></span>Saturday 26 September 2026</button>
<button type="button" class="icon-btn btn-s" aria-label="Next day" style="border: 1px solid var(--ctl-line); width: 44px; height: 44px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<span class="tag tag-soft" style="margin-left: 4px">Today</span>
</div>

<div class="card" style="overflow: hidden">
<div style="display: flex; align-items: center; gap: 16px; padding: 18px 20px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-grow: 1"><h2 class="h2">Who came</h2><span class="s14 t2">23 people · 27 visits</span></div>
<button type="button" class="chip" aria-pressed="false">Outside opening hours <span class="n">1</span></button>
<label class="search" style="width: 280px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input class="input" type="search" placeholder="Search by name" aria-label="Search by name"></label>
</div>

<button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span class="s15 w6">Olivia Bennett</span><span class="s13 t2">olivia.bennett@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">6:02 AM</span></span>
</button>

<div style="border-top: 1px solid var(--line); background: var(--raise)">
<button type="button" aria-expanded="true" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border: 0; background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span class="s15 w6">Marcus Reed</span><span class="s13 t2">marcus.reed@example.com</span></span>
<span class="s13 w6 t2">came 2 times</span>
<span style="display: flex; gap: 6px"><span class="tc" style="background: var(--card)">6:15 AM</span><span class="tc" style="background: var(--card)">5:40 PM</span></span>
</button>
<div style="margin: 0 20px 16px; padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--card-line); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><span class="s14 w6" style="flex-grow: 1">Marcus Reed — when they came</span><button type="button" class="icon-btn" aria-label="Close" style="width: 32px; height: 32px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); row-gap: 8px; align-items: center">
<span class="s13 t2">Fri 25 Sep</span><span style="display: flex; gap: 6px"><span class="tc">6:10 AM</span></span>
<span class="s13 t2">Thu 24 Sep</span><span style="display: flex; gap: 6px"><span class="tc">6:05 AM</span><span class="tc">5:52 PM</span></span>
<span class="s13 t2">Wed 23 Sep</span><span style="display: flex; gap: 6px"><span class="tc">6:12 AM</span></span>
<span class="s13 t2">Tue 22 Sep</span><span style="display: flex; gap: 6px"><span class="tc">6:03 AM</span></span>
<span class="s13 t2">Mon 21 Sep</span><span style="display: flex; gap: 6px"><span class="tc">6:20 AM</span><span class="tc">6:01 PM</span></span>
</div>
<span class="s13 t3">Showing their most recent visits.</span>
</div>
</div>

<button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span class="s15 w6">Sofia Alvarez</span><span class="s13 t2">sofia.alvarez@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">7:30 AM</span></span>
</button>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span class="s15 w6">Emma Clarke</span><span class="s13 t2">emma.clarke@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc tc-warn">5:41 AM · outside hours</span></span>
</button>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span class="s15 w6">Liam Hughes</span><span class="s13 t2">liam.hughes@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">12:10 PM</span></span>
</button>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--t1); text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span class="s15 w6">Noah Patel</span><span class="s13 t2">noah.patel@example.com</span></span>
<span style="display: flex; gap: 6px"><span class="tc">4:30 PM</span></span>
</button>
<div style="padding: 16px 20px; border-top: 1px solid var(--line)"><button type="button" class="btn btn-s">Show more people</button></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":%H%}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
