<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type card instead — slides in from the right (Square's card form)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0C0B0A}
</style>
</helmet>
<div class="app t-dark {{look}} over" style="height: 1900px">
<dc-import name="PersonCard" look="{{lookName}}" hint-size="1440px,1900px"></dc-import>
<div class="scrim"></div>
<div class="drawer" style="position: absolute; top: 0; right: 0; bottom: 0; width: 520px">
<div class="dw-h"><div class="row between top" style="width: 100%"><div class="stack-2"><h3 class="h2">Replace Visa ending 1111</h3><span class="small">The new card takes the place of Visa ending 1111.</span></div><span class="icon-btn icon-btn-sm icon-btn-q" aria-label="Close"><svg class="ic ic-s" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span></div></div>
<div class="dw-b stack">
<div class="field"><span class="flabel">Card</span><div class="input"><span class="phd">Card number</span><span class="phd" style="margin-left: auto">MM/YY · CVV · ZIP</span></div></div>
<label class="row top" style="gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid var(--line)"><span class="box"></span><span class="body">I agree that Iron House may save this card and charge it for my membership and any fees when they are due. I can remove it at the front desk at any time.</span></label>
<p class="small">Sam Rivera reads and ticks this box.</p>
</div>
<div class="dw-f row-s"><span class="btn btn-dis">Save card</span><span class="btn btn-q">Back</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
renderVals() {
const lookName = this.props.look ?? 'Dark';
return { look: lookName === 'Light' ? 't-light' : '', lookName };
}
}
</script>
</body>
</html>
