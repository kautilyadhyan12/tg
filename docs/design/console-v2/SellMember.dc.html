<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell — a sale recorded</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0C0B0A}
</style>
</helmet>
<div class="app t-dark {{look}} over" style="height: 1410px">
<dc-import name="Sell" look="{{lookName}}" hint-size="1440px,1410px"></dc-import>
<div class="card" style="position: absolute; left: 300px; top: 188px; width: 688px; height: 641px; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center">
<div style="width: 84px; height: 84px; border-radius: 999px; background: var(--good-bg); color: var(--good); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" style="width: 44px; height: 44px; stroke-width: 2.4"><path d="M20 6L9 17l-5-5"/></svg></div>
<div class="stack-xs" style="align-items: center"><h2 class="h1s">Sale recorded</h2><p class="sub" style="max-width: 440px">Sold: 2 × Protein bar to Maya Patel. ₹240.00, cash.</p></div>
<div class="row-s"><span class="btn btn-p btn-lg"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>New sale</span><span class="btn btn-s btn-lg"><svg class="ic" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1zM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/></svg>View receipt</span></div>
<p class="small" style="max-width: 460px">It is in today's list below. If it was a mistake, press ⋯ on its row, then Void sale.</p>
</div>
<div class="menu-pop" style="left: 1066px; top: 1096px; width: 320px; z-index: 6">
<div class="mi"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><div class="stack-2"><span class="body w6">Refund sale</span><span class="small">You gave some or all of the money back.</span></div></div>
<div class="hr" style="margin: 6px 8px"></div>
<div class="mi"><svg class="ic bad" viewBox="0 0 24 24"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0M4.9 4.9l14.2 14.2"/></svg><div class="stack-2"><span class="body w6 bad">Void sale</span><span class="small">It was recorded by mistake. It will no longer count.</span></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"$preview":{"width":1440,"height":1410}}'>
class Component extends DCLogic {
renderVals() {
const lookName = this.props.look ?? 'Dark';
return { look: lookName === 'Light' ? 't-light' : '', lookName };
}
}
</script>
</body>
</html>
