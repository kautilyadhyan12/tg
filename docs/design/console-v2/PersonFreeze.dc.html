<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freeze a membership — asks first, in the middle</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0C0B0A}
</style>
</helmet>
<div class="app t-dark {{look}} over" style="height: 1000px">
<dc-import name="PersonMaya" look="{{lookName}}" hint-size="1440px,1488px"></dc-import>
<div class="scrim"></div>
<div class="dialog" style="width: 540px; padding: 30px">
<div style="width: 48px; height: 48px; border-radius: 14px; background: var(--info-bg); color: var(--info); display: flex; align-items: center; justify-content: center"><svg class="ic ic-l" viewBox="0 0 24 24"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg></div>
<div class="stack-xs"><h2 class="h2" style="font-size: 22px; line-height: 28px">Freeze Maya Patel's Gold Monthly?</h2><p class="sub">It is put on hold from today. When you unfreeze it, the days it was frozen are added back, so Maya Patel loses no days.</p></div>
<div class="row-s"><span class="btn btn-p"><svg class="ic" viewBox="0 0 24 24"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg>Freeze</span><span class="btn btn-q">Back</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const lookName = this.props.look ?? 'Dark';
return { look: lookName === 'Light' ? 't-light' : '', lookName };
}
}
</script>
</body>
</html>
