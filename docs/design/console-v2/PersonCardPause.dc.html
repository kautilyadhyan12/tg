<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause automatic payments — asks in the middle, naming each membership</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0C0B0A}
</style>
</helmet>
<div class="app t-dark {{look}} over" style="height: 1900px">
<dc-import name="PersonCard" look="{{lookName}}" hint-size="1440px,1900px"></dc-import>
<div class="scrim"></div>
<div class="dialog" style="position: absolute; left: 50%; top: 600px; transform: translateX(-50%); width: 520px; padding: 28px">
<h3 class="h2">Pause automatic payments?</h3>
<p class="body" style="color: var(--t2)">Visa ending 1111 won't be charged automatically for:</p>
<div class="well row-m" style="padding: 12px 14px"><div class="av av-sm">SR</div><span class="body w6">Sam Rivera · Gold Weekly</span></div>
<p class="small">The card stays saved. Bills still come due: take payment at the desk, or charge the card from the bill.</p>
<div class="row-s end"><span class="btn btn-q">Cancel</span><span class="btn btn-p"><svg class="ic" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>Pause</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
renderVals() {
const lookName = this.props.look ?? 'Dark';
return { look: lookName === 'Light' ? 't-light' : '', lookName };
}
}
</script>
</body>
</html>
