<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remove a post — asks in the middle</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0C0B0A}
</style>
</helmet>
<div class="app t-dark {{look}} over" style="height: 1000px">
<dc-import name="Updates" look="{{lookName}}" hint-size="1440px,1865px"></dc-import>
<div class="scrim"></div>
<div class="dialog" style="width: 520px; padding: 30px">
<div class="row between top"><div class="stack-xs"><h2 class="h2" style="font-size: 22px; line-height: 28px">Remove this post?</h2><p class="sub">The post and its 2 photos will disappear for every one of your members and for your staff. This can't be undone.</p></div><span class="icon-btn icon-btn-q" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span></div>
<div class="well stack-s"><span class="s13" style="color: var(--t2)">Leela Menon · 17 Oct, 7:05 am</span><span class="s14">Finally hit a 60 kg deadlift this morning. Thank you coach Sameer for the patience!</span></div>
<div class="row-s" style="justify-content: flex-end"><span class="btn btn-s">Keep post</span><span class="btn btn-d">Remove post</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const lookName = this.props.look ?? 'Dark';
return { look: lookName === 'Light' ? 't-light' : '', lookName };
}
}
</script>
</body>
</html>
