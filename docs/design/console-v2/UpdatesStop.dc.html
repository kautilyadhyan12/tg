<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stop someone posting — asks in the middle</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0C0B0A}
</style>
</helmet>
<div class="app t-dark {{look}} over" style="height: 1000px">
<dc-import name="Updates" look="{{lookName}}" hint-size="1440px,1865px"></dc-import>
<div class="scrim"></div>
<div class="dialog" style="width: 540px; padding: 30px">
<div class="row between top"><div class="stack-xs"><h2 class="h2" style="font-size: 22px; line-height: 28px">Stop Rahul Verma posting?</h2><p class="sub">Rahul Verma won't be able to post on Updates until you let them again. They can still read and react. Their posts stay until you remove them. They aren't emailed, and nobody else changes.</p></div><span class="icon-btn icon-btn-q" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span></div>
<div class="row-s" style="justify-content: flex-end"><span class="btn btn-s">Cancel</span><span class="btn btn-d">Stop Rahul Verma posting</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const lookName = this.props.look ?? 'Dark';
return { look: lookName === 'Light' ? 't-light' : '', lookName };
}
}
</script>
</body>
</html>
