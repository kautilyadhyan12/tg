// The camera screen (ROADMAP Stage 5 item 53a): this app's own Android code, linked by Expo from apps/mobile/modules as
// the heart rate's is. The phone's selfie camera through Google's pose library, as 51b-ii picked it (the full model, on
// the main chip, on 4 cores). Unlike the phone test (modules/phone-test, a folder's copy's alone), this is in the store's
// app too.
import java.security.MessageDigest

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.posecamera'
version = '1.0.0'

// The pose model the phone runs, fetched at its pinned version and checked by its SHA-256 before a build may use it.
// Never kept in git (the web's model is not either: .gitignore): a build has the internet, a workout does not. The same
// file as packages/movement/scripts/phoneRun.ts names (MODELS, "full"); apps/mobile/test/poseCamera.test.ts holds both
// equal.
def poseModel = [
  file: 'pose_landmarker_full.task',
  url: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
  bytes: 9398198L,
  sha256: '5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1',
]
def modelFolder = layout.buildDirectory.dir('generated/pose-model').get().asFile

def sha256Of = { File f ->
  def digest = MessageDigest.getInstance('SHA-256')
  f.withInputStream { input ->
    byte[] chunk = new byte[1 << 16]
    int n
    while ((n = input.read(chunk)) > 0) digest.update(chunk, 0, n)
  }
  digest.digest().encodeHex().toString()
}

def wholeModel = { File f -> f.exists() && f.length() == poseModel.bytes && sha256Of(f) == poseModel.sha256 }

tasks.register('fetchPoseModel') {
  def kept = new File(modelFolder, poseModel.file)
  outputs.file(kept)
  outputs.upToDateWhen { wholeModel(kept) }
  doLast {
    if (wholeModel(kept)) return
    modelFolder.mkdirs()
    def part = new File(modelFolder, poseModel.file + '.part')
    new URL(poseModel.url).withInputStream { input -> part.withOutputStream { it << input } }
    if (!wholeModel(part)) {
      part.delete()
      throw new GradleException("The pose model from ${poseModel.url} is not the pinned one (its size or SHA-256 differs).")
    }
    kept.delete()
    if (!part.renameTo(kept)) throw new GradleException("The pose model could not be put in place: ${kept}")
  }
}

android {
  namespace "expo.modules.posecamera"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      assets.srcDirs += [modelFolder]
    }
  }
}

preBuild.dependsOn 'fetchPoseModel'

dependencies {
  // Google's pose library for Android, the release the phone test measured (51a to 51c), pinned.
  implementation "com.google.mediapipe:tasks-vision:1.0.0"
  // Android's camera library, the very version the app already holds for the meal photo (expo-camera's camerax_version),
  // so the app adds no copy of it. The screen shows the model's own pictures, so its preview library is not needed.
  implementation "androidx.camera:camera-core:1.6.0"
  implementation "androidx.camera:camera-camera2:1.6.0"
  implementation "androidx.camera:camera-lifecycle:1.6.0"
  // React Native, the app's own, for the look's font the body's words are drawn in (as expo-font reaches it).
  implementation 'com.facebook.react:react-android'
}
