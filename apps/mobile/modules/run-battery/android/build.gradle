// The phone's battery limit on this app, for a run (ROADMAP Stage 5 item 37l): this app's own Android code, linked by
// Expo from apps/mobile/modules as any Expo package is.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.runbattery'
version = '1.0.0'

android {
  namespace "expo.modules.runbattery"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
